name: Copy Secrets to Drawdown Radar

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TARGET="zhai66666-max/global-drawdown-radar"
          echo "Copying secrets to $TARGET..."
          
          gh secret set SENDER_EMAIL -R "$TARGET" -b"${{ secrets.SENDER_EMAIL }}"
          echo "✅ SENDER_EMAIL"
          
          gh secret set SENDER_PASSWORD -R "$TARGET" -b"${{ secrets.SENDER_PASSWORD }}"
          echo "✅ SENDER_PASSWORD"
          
          gh secret set RECIPIENT_EMAIL -R "$TARGET" -b"${{ secrets.RECIPIENT_EMAIL }}"
          echo "✅ RECIPIENT_EMAIL"
          
          gh secret set SMTP_SERVER -R "$TARGET" -b"${{ secrets.SMTP_SERVER }}"
          echo "✅ SMTP_SERVER"
          
          gh secret set SMTP_PORT -R "$TARGET" -b"${{ secrets.SMTP_PORT }}"
          echo "✅ SMTP_PORT"
          
          gh secret set DEEPSEEK_API_KEY -R "$TARGET" -b"${{ secrets.DEEPSEEK_API_KEY }}"
          echo "✅ DEEPSEEK_API_KEY"
          
          echo "All secrets copied!"
